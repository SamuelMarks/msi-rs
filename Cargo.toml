[workspace]
resolver = "2"
members = [
    "crates/msi",
    "crates/msi-cli",
    "crates/msi-gui",
    "crates/msi-ffi",
    "crates/msi-python",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"
readme = "README.md"
repository = "https://github.com/samuel/msi-rs"
keywords = ["msi", "windows-installer", "cfb", "cab", "wix"]
categories = ["development-tools", "os::windows-apis", "filesystem"]

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
unreachable_pub = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_qualifications = "deny"
explicit_outlives_requirements = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
non_ascii_idents = "deny"
noop_method_call = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unknown_lints = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
missing_docs_in_private_items = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
clone_on_ref_ptr = "deny"
empty_structs_with_brackets = "deny"
exit = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
multiple_inherent_impl = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
semicolon_if_nothing_returned = "deny"
string_add = "deny"
string_add_assign = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
needless_raw_strings = "deny"
infinite_loop = "deny"
redundant_clone = "deny"
suspicious_operation_groupings = "deny"
shadow_unrelated = "deny"
create_dir = "deny"
mixed_read_write_in_expression = "deny"
mutex_atomic = "deny"
doc_markdown = "deny"
match_wildcard_for_single_variants = "deny"
match_same_arms = "deny"
manual_string_new = "deny"
manual_let_else = "deny"
flat_map_option = "deny"
filter_map_next = "deny"
explicit_iter_loop = "deny"
explicit_into_iter_loop = "deny"
deref_by_slicing = "deny"
cloned_instead_of_copied = "deny"
case_sensitive_file_extension_comparisons = "deny"
bool_to_int_with_if = "deny"
as_underscore = "deny"
as_pointer_underscore = "deny"
checked_conversions = "deny"
default_trait_access = "deny"
disallowed_script_idents = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_line_after_outer_attr = "deny"
expl_impl_clone_on_copy = "deny"
format_push_string = "deny"
get_unwrap = "deny"
implicit_clone = "deny"
index_refutable_slice = "deny"
inefficient_to_string = "deny"
iter_not_returning_iterator = "deny"
large_digit_groups = "deny"
large_include_file = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
linkedlist = "deny"
macro_use_imports = "deny"
manual_assert = "deny"
manual_instant_elapsed = "deny"
manual_ok_or = "deny"
map_unwrap_or = "deny"
map_with_unused_argument_over_ranges = "deny"
match_bool = "deny"
match_wild_err_arm = "deny"
mismatching_type_param_order = "deny"
missing_enforced_import_renames = "deny"
missing_fields_in_debug = "deny"
mut_mut = "deny"
mutex_integer = "deny"
needless_continue = "deny"
needless_for_each = "deny"
needless_pass_by_value = "deny"
needless_raw_string_hashes = "deny"
negative_feature_names = "deny"
option_as_ref_cloned = "deny"
option_option = "deny"
pathbuf_init_then_push = "deny"
redundant_else = "deny"
redundant_feature_names = "deny"
ref_binding_to_reference = "deny"
ref_option_ref = "deny"
semicolon_inside_block = "deny"
should_panic_without_expect = "deny"
single_char_pattern = "deny"
single_match_else = "deny"
string_lit_chars_any = "deny"
struct_excessive_bools = "deny"
suspicious_xor_used_as_pow = "deny"
trailing_empty_array = "deny"
trait_duplication_in_bounds = "deny"
try_err = "deny"
type_repetition_in_bounds = "deny"
uninlined_format_args = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_struct_initialization = "deny"
unnecessary_wraps = "deny"
unnested_or_patterns = "deny"
unused_async = "deny"
unused_peekable = "deny"
unused_result_ok = "deny"
unused_rounding = "deny"
unused_self = "deny"
unwrap_in_result = "deny"
use_self = "deny"
used_underscore_binding = "deny"
verbose_bit_mask = "deny"
verbose_file_reads = "deny"
wildcard_dependencies = "deny"
wildcard_imports = "deny"
zero_sized_map_values = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
assert_is_empty = "allow"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
derive_more = { version = "2.1", features = ["display", "error"] }
libc = { version = "0.2", default-features = false }
rayon = "1.10"
msi = { path = "crates/msi" }

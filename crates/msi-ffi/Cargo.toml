[package]
name = "msi-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "C-ABI Foreign Function Interface for creating and inspecting Windows Installer (.msi) packages"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[lints]
workspace = true

[dependencies]
msi = { workspace = true }

[dev-dependencies]
libloading = { version = "0.8", default-features = false }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

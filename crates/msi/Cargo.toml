[package]
name = "msi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Comprehensive library for creating and inspecting Windows Installer (.msi) packages"

[lints]
workspace = true

[dependencies]
derive_more = { workspace = true }
dirs = { version = "7.0", default-features = false }
goblin = { version = "0.10", default-features = false, features = ["pe32", "pe64"] }
libc = { workspace = true }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
rayon = { workspace = true }
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std"] }

[dev-dependencies]
tempfile = { version = "3.27", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry"] }

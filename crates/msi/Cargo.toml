[package]
name = "msi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Comprehensive library for creating and inspecting Windows Installer (.msi) packages"

[lints]
workspace = true

[dependencies]
derive_more = { workspace = true }
goblin = "0.10.7"
libc = { workspace = true }
rayon = { workspace = true }
rustix = { version = "1.1.5", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_Foundation", "Win32_System_Rpc"] }

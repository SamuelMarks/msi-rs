name: Continuous Integration

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

  docs:
    name: Documentation Coverage & Validity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify Documentation Build
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

  test:
    name: Test Suite (${{ matrix.os }} - ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, 1.85.0]
        include:
          - os: ubuntu-latest
            rust: beta
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Unit and Integration Tests
        run: cargo test --workspace --all-features --exclude msi-python

  test-c-ffi:
    name: C-FFI Compatibility & Integration
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build C-FFI Shared & Static Libraries
        run: cargo build -p msi-ffi --release

      - name: Compile and Run C API Integration Test (POSIX)
        run: |
          mkdir -p target/c_test
          gcc -O2 -Wall -Wextra \
            -Icrates/msi-ffi/include \
            crates/msi-ffi/tests/test_c_api.c \
            target/release/libmsi_ffi.a \
            -lpthread -ldl -lm \
            -o target/c_test/test_c_api
          ./target/c_test/test_c_api

  test-python:
    name: Python Bindings & Test Suite (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo & Pip
        uses: Swatinem/rust-cache@v2

      - name: Install Python Build Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-cov

      - name: Build & Install Python Package via Maturin
        run: |
          maturin build --manifest-path crates/msi-python/Cargo.toml --out target/wheels
          pip install --no-index --find-links=target/wheels msi

      - name: Run Pytest Test Suite
        run: pytest tests/python

  coverage:
    name: Code Coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Generate Code Coverage Report
        run: cargo llvm-cov --workspace --all-targets --all-features --exclude msi-python --lcov --output-path lcov.info

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-lcov
          path: lcov.info
